spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/trading?useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: always
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
logging:
  level:
    com.fynxt.trading: INFO
